# Production stack — single VPS. See FinanceApp.Documentations/GOING_LIVE.md for the runbook.
#
# Order of operations on a fresh box:
#   1. docker compose up -d db
#   2. dotnet ef database update ...   (see GOING_LIVE.md — must happen before step 3)
#   3. docker compose up -d
#
# All secrets come from .env (chmod 600, never committed) — see .env.example.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: financeapp-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - db-data:/var/opt/mssql
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [internal]

  api:
    image: ${API_IMAGE:-financeapp-api:local}
    container_name: financeapp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Overrides the shared .env value — api is the job owner by default. See
      # .env.example for why this can't just be Jobs__Enabled inside .env: both
      # services load the same file, so a single shared value can't put the jobs
      # on only one of them.
      Jobs__Enabled: ${API_JOBS_ENABLED:-true}
    volumes:
      - uploads:/app/wwwroot/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  web:
    image: ${WEB_IMAGE:-financeapp-web:local}
    container_name: financeapp-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jobs__Enabled: ${WEB_JOBS_ENABLED:-false}
    volumes:
      - uploads:/app/wwwroot/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: financeapp-caddy
    restart: unless-stopped
    depends_on: [web, api]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

networks:
  internal:

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
